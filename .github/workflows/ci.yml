name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` not `install`: fails loudly if the lockfile and package.json
      # have drifted, rather than quietly resolving something different.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # Backend values come from the committed .env.production. They are not
        # passed as repository variables: an unset variable expands to an empty
        # string, which Vite would treat as a real value and use to override the
        # file — producing a green build with the backend silently switched off.
        run: npx vite build
