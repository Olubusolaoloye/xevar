name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# The deploy needs to write Pages and mint an OIDC token for it; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # Project pages are served from /<repo>/, not the domain root, so the
        # asset base has to match or every script and stylesheet 404s.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public values — see .env.example. Stored as repository variables so
          # they can be rotated without a code change.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Write build version
        # The running app polls this to notice it is out of date. GitHub Pages
        # caches index.html for ten minutes and honours no config we can ship,
        # so the app has to detect staleness itself.
        run: |
          printf '{"buildId":"%s","builtAt":"%s"}\n' \
            "$(echo "${{ github.sha }}" | cut -c1-8)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          cat dist/version.json

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules. It does serve 404.html for any
        # unknown path, so an exact copy of index.html there makes the client
        # router pick up deep links like /screener instead of showing a 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
