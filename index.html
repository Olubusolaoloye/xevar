<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ========================================================================
         Index metadata.

         This is the only description of PanScreener that a search engine, a
         Telegram unfurl or an X card ever sees — none of them run the app — so
         it says what the product actually does rather than naming a category.
         ===================================================================== -->

    <title>PanScreener — live token prices, liquidity and order flow across 8 chains</title>

    <meta
      name="description"
      content="PanScreener tracks listed tokens across Ethereum, BNB Chain, Solana, Base, Arbitrum, Polygon, Avalanche and Sui. Live price, liquidity, 24h volume, buy and sell pressure, holders and contract verdicts on one board — plus threshold alerts and a profit calculator. Market data comes from live on-chain pools; nothing is simulated."
    />
    <meta
      name="keywords"
      content="token tracker, live token price, liquidity, order flow, market cap alerts, multi-chain, Ethereum, BNB Chain, Solana, Base, Arbitrum, Polygon, Avalanche, Sui, token listing"
    />
    <meta name="author" content="PanScreener" />
    <link rel="canonical" href="https://coinpan.netlify.app/" />

    <!-- Both themes are supported; the app stamps its own choice on <html>.
         Declaring only "dark" made the browser paint a dark ground behind a
         light page for the split second before the bundle ran. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />

    <!-- Open Graph — what Telegram, Discord, Slack and Facebook render. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PanScreener" />
    <meta property="og:url" content="https://coinpan.netlify.app/" />
    <meta
      property="og:title"
      content="PanScreener — live token prices, liquidity and order flow across 8 chains"
    />
    <meta
      property="og:description"
      content="Every pair. Every chain. One board. Live price, liquidity, volume and buy-sell pressure for listed tokens, with alerts on price or market cap and a shareable P&amp;L card."
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="PanScreener — live token prices, liquidity and order flow across 8 chains"
    />
    <meta
      name="twitter:description"
      content="Every pair. Every chain. One board. Live market data from on-chain pools, threshold alerts, and a shareable P&amp;L card."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Typography: display, interface and tabular mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
