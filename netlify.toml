# Netlify deployment for PanScreener.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# PanScreener is a single-page app: the router owns /screener, /pair/:id and
# the rest. Without this rule the static host looks for a file at that path and
# returns 404 on any refresh or direct link — every route except "/" breaks.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable; the HTML entry point must never be cached
# or a deploy leaves browsers pinned to the previous bundle.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
